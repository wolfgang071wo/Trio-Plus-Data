name: Windows app

on:
  push:
    branches: [trioplus-core]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pyinstaller pytest .
      - name: Test
        run: python -m pytest -q tests
      - name: Build TrioTool.exe
        run: >
          pyinstaller --onefile --name TrioTool --noconfirm
          --add-data "trioplus/gui/static;trioplus/gui/static"
          --add-data "trioplus/data;trioplus/data"
          --paths .
          --collect-submodules trioplus
          --hidden-import tkinter
          packaging/trio_tool.py
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/TrioTool.exe -ArgumentList "--no-browser","--port","8799" -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing; if ($r.Content -match "TRIO Tool") { $ok = $true; break } } catch {}
            if ($p.HasExited) { break }
          }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process $p }
          if (-not $ok) { throw "TrioTool.exe did not serve the page" }
      - uses: actions/upload-artifact@v4
        with:
          name: TrioTool-windows
          path: dist/TrioTool.exe
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import trioplus; print(trioplus.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TRIO Tool ${{ steps.ver.outputs.version }}
          body: |
            TrioTool.exe for Windows: download, double-click, the app opens in your browser.
            Closing the console window (or "Beenden" in the app) stops it.
          files: dist/TrioTool.exe
          make_latest: true
