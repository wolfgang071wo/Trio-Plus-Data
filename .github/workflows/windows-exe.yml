name: Windows app

on:
  push:
    branches: [trioplus-core]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build TrioTool.exe
        run: >
          pyinstaller --onefile --name TrioTool --noconfirm
          --add-data "trioplus/gui/static;trioplus/gui/static"
          --add-data "trioplus/data;trioplus/data"
          --hidden-import tkinter
          packaging/trio_tool.py
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist/TrioTool.exe -ArgumentList "--no-browser","--port","8799" -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
          if ($r.Content -notmatch "TRIO Tool") { throw "page not served" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: TrioTool-windows
          path: dist/TrioTool.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TrioTool.exe
