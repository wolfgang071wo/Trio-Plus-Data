<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRIO Tool</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500 600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --alu:#d9dcd8; --panel:#eef0ec; --line:#b9bdb8; --graphite:#24282a; --muted:#5d6462;
  --led-green:#2e9e4e; --led-amber:#e09b12; --led-red:#c9433a; --led-off:#a7aca8;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--alu);color:var(--graphite);font:16px/1.45 var(--sans);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 3px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:.45rem .8rem}
button:hover{border-color:var(--graphite)}
button.primary{background:var(--graphite);color:var(--panel);border-color:var(--graphite)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--led-amber);outline-offset:2px}
.shell{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:700 1.6rem/1 var(--cond);letter-spacing:.02em;margin-right:auto;display:flex;align-items:baseline;gap:.6rem}
.brand small{font:500 .95rem var(--cond);color:var(--muted)}
.export{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--muted)}
.export code{font:inherit;color:var(--graphite);white-space:nowrap}
aside{border-right:1px solid var(--line);overflow:auto;padding:1rem .8rem}
main{overflow:auto;padding:1.4rem 1.8rem 3rem}
.src{margin-bottom:1.4rem}
.src h2{font:600 1.05rem var(--cond);margin:0 0 .4rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.src h2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src h2 button{padding:.1rem .45rem;font-size:.8rem}
.song{display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:.4rem;width:100%;text-align:left;border:1px solid transparent;background:none;padding:.35rem .45rem;border-radius:6px}
.song:hover{border-color:var(--line)}
.song[aria-current="true"]{background:var(--panel);border-color:var(--graphite)}
.song .num{font:600 1.1rem var(--cond);color:var(--muted)}
.song.empty{color:var(--muted)}
.song.empty .num{opacity:.6}
.dots{display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--led-off)}
.dot.g{background:var(--led-green)} .dot.a{background:var(--led-amber)}
.empty-state{max-width:52ch;margin:12vh auto 0}
.empty-state h1{font:700 2.4rem/1.05 var(--cond);margin:0 0 .6rem}
.empty-state p{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.songhead{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;margin-bottom:1.2rem}
.songhead h1{font:700 2.6rem/1 var(--cond);margin:0}
.songhead p{margin:.25rem 0 0;color:var(--muted)}
.face{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.4rem 1rem}
.part{display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.led{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--led-off);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);display:grid;place-items:center;font:700 1.1rem var(--cond);color:var(--panel)}
.led.g{background:var(--led-green);box-shadow:0 0 12px rgba(46,158,78,.55),inset 0 -2px 3px rgba(0,0,0,.2)}
.led.a{background:var(--led-amber);box-shadow:0 0 10px rgba(224,155,18,.5),inset 0 -2px 3px rgba(0,0,0,.2)}
.parthead{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline;margin-bottom:.4rem}
.parthead strong{font:600 1.2rem var(--cond)}
.parthead span{color:var(--muted);font-size:.9rem}
.track{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.6rem;align-items:center;margin:.25rem 0}
.track label{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;line-height:1.2}
.track label .live{color:var(--led-green);font-weight:600}
.parthead .row button{padding:.3rem .6rem;font-size:.88rem}
.wave{width:100%;height:46px;display:block;background:#e3e6e1;border-radius:4px;cursor:pointer}
.track .acts{display:flex;gap:.35rem}
.track .acts button{padding:.25rem .55rem;font-size:.85rem}
.note{color:var(--muted);font-size:.92rem;margin:.2rem 0}
.builder{margin-top:2rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem}
.builder h2{font:700 1.5rem var(--cond);margin:0 0 .2rem}
.slots{display:grid;gap:.45rem;margin:.8rem 0}
.slot{display:grid;grid-template-columns:4.5rem 1fr;gap:.6rem;align-items:center}
.slot span{font:600 1.05rem var(--cond)}
select,input[type=text]{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.4rem .5rem;width:100%}
#status{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--graphite);color:var(--panel);padding:.6rem 1rem;border-radius:8px;max-width:min(90vw,70ch);display:none;gap:.8rem;align-items:center}
#status.show{display:flex}
#status.err{background:var(--led-red)}
#status button{background:transparent;color:inherit;border-color:rgba(255,255,255,.4);padding:.2rem .6rem}
.pathform{display:flex;gap:.5rem;margin-top:1rem}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}
  main{padding:1rem}
  .track{grid-template-columns:4.5rem 1fr}
  .track .acts{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">TRIO Tool <small id="ver"></small></div>
    <button id="openCard">Karte oder Song öffnen…</button>
    <button id="openFolder">Ordner öffnen…</button>
    <div class="export">Speichern in <code id="exportDir" title=""></code>
      <button id="changeDir">Ändern…</button><button id="reveal">Anzeigen</button></div>
    <button id="quit">Beenden</button>
  </header>
  <aside id="sources" aria-label="Geöffnete Karten und Songs"></aside>
  <main id="main"></main>
</div>
<div id="status" role="status" aria-live="polite"><span id="statusText"></span><button id="statusAction" hidden>Ordner anzeigen</button></div>
<audio id="player" preload="none"></audio>

<script>
const TOKEN = "__TOKEN__";
const GENRES = {0:"Blues",1:"R&B",2:"Rock"};
const BASS = {0:"Bass aktiv",1:"Bass einfach",3:"Bass Riff"};
let state = {sources:[],songs:[]}, current = null, playing = null, cards = [];
const builder = [null,null,null,null,null];
let newName = "Neuer Song";

const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k);
  return e;
};
const api = async (path, body) => {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + TOKEN, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN}, body:JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Aktion fehlgeschlagen");
  return j;
};
const secs = s => s.toFixed(1).replace(".", ",") + " s";
let statusTimer;
function status(text, {error=false, reveal=false}={}) {
  $("#statusText").textContent = text;
  $("#status").className = "show" + (error ? " err" : "");
  $("#statusAction").hidden = !reveal;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => $("#status").className = "", error ? 9000 : 6000);
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { status(e.message, {error:true}); } };

function partState(p) {
  if (!p.trained) return "";
  return (p.tracks && (p.tracks.main.has_audio || p.tracks.overdub.has_audio)) ? "g" : "a";
}
function songLabel(s) { return s.number ? `Song ${String(s.number).padStart(2,"0")}` : (s.file || s.name); }

function renderSources() {
  const box = $("#sources"); box.replaceChildren();
  if (!state.sources.length) {
    box.append(el("p", {class:"note"}, "Noch nichts geöffnet."));
    return;
  }
  for (const src of state.sources) {
    const songs = state.songs.filter(s => s.source === src.id);
    box.append(el("section", {class:"src"},
      el("h2", {}, el("span", {title:src.path}, src.kind === "card" ? `Karte: ${src.name}` : src.name),
        el("button", {onclick: run(async () => { const r = await api("/api/close", {source:src.id}); state = r.state;
          if (current && current.startsWith(src.id + ":")) current = null; render(); }), "aria-label":`${src.name} schließen`}, "Schließen")),
      songs.map(s => el("button", {class:"song" + (s.recorded ? "" : " empty"), "aria-current": s.id === current ? "true" : "false",
          onclick: () => { current = s.id; render(); }},
        el("span", {class:"num"}, s.number ? String(s.number).padStart(2,"0") : "·"),
        el("span", {}, s.name),
        el("span", {class:"dots", "aria-hidden":"true"}, s.parts.map(p => el("span", {class:"dot " + partState(p)})))))
    ));
  }
}

function renderEmpty() {
  const m = $("#main");
  const form = el("form", {class:"pathform", onsubmit: run(async e => { e.preventDefault();
      const p = $("#pathInput").value.trim(); if (p) await openPath({path:p}); })},
    el("input", {type:"text", id:"pathInput", placeholder:"Pfad, z. B. E:\\TRIOPLUS.DAT", "aria-label":"Pfad zur Karte, zu einem Song oder Ordner"}),
    el("button", {type:"submit"}, "Öffnen"));
  m.replaceChildren(el("div", {class:"empty-state"},
    el("h1", {}, "Songs vom TRIO+ holen"),
    el("p", {}, "Öffne die TRIOPLUS.DAT von der SD-Karte, einen exportierten Song (.tlsd) oder einen Ordner mit Songs. Die Dateien werden nur gelesen."),
    cards.length ? el("div", {class:"row"}, cards.map(c => el("button", {class:"primary", onclick: run(() => openPath({path:c}))}, `SD-Karte öffnen: ${c}`))) : null,
    form));
}

function bandText(p) {
  if (!p.band) return "";
  const b = p.band, bits = [];
  bits.push(GENRES[b.genre] || `Genre ${b.genre + 1}`);
  bits.push(`Style ${b.style + 1}`);
  bits.push(BASS[b.bass_mode] || `Bassmodus ${b.bass_mode}`);
  if (b.alt_time) bits.push("Alt Time");
  return bits.join(", ");
}

function renderSong() {
  const s = state.songs.find(x => x.id === current);
  if (!s) { current = null; return renderEmpty(); }
  const src = state.sources.find(x => x.id === s.source);
  const m = $("#main");
  const head = el("div", {class:"songhead"},
    el("div", {}, el("h1", {}, s.name), el("p", {}, `${songLabel(s)} auf ${src ? src.name : ""}`)),
    s.recorded ? el("div", {class:"row"},
      el("button", {onclick: run(() => doExport({song:s.id, what:"wav"}))}, "Alle Spuren als WAV speichern"),
      el("button", {class:"primary", onclick: run(() => doExport({song:s.id, what:"tlsd"}))}, "Als .tlsd speichern")) : null);
  const face = el("div", {class:"face"});
  if (!s.parts.some(p => p.trained)) face.append(el("p", {class:"note"}, "In diesem Song ist nichts aufgenommen."));
  for (const p of s.parts) {
    const st = partState(p);
    const body = el("div", {});
    if (!p.trained) {
      body.append(el("div", {class:"parthead"}, el("strong", {}, `Part ${p.part}`), el("span", {}, "leer")));
    } else {
      const dur = Math.max(p.tracks.main.seconds, p.tracks.overdub.seconds);
      body.append(el("div", {class:"parthead"}, el("strong", {}, `Part ${p.part}`), el("span", {}, secs(dur)), el("span", {}, bandText(p)),
        el("span", {class:"row"},
          el("button", {onclick: () => addToBuilder(s.id, p.part)}, "In neuen Song übernehmen"),
          el("button", {onclick: run(() => importWav(s.id, p.part, "replace")),
            title:"Eine WAV-Datei wird zur Aufnahme dieses Parts. Länge und gelernte Begleitung bleiben."}, "WAV als Aufnahme…"),
          p.current ? el("button", {onclick: run(() => importWav(s.id, p.part, "mix")),
            title:"Eine WAV-Datei wird leiser zur gespielten Spur dazugemischt."}, "WAV dazumischen…") : null)));
      let any = false;
      for (const t of ["main","overdub"]) {
        if (!p.tracks[t].has_audio) continue;
        any = true;
        const canvas = el("canvas", {class:"wave", "data-song":s.id, "data-part":p.part, "data-track":t,
          role:"img", "aria-label":`Wellenform Part ${p.part} ${t === "main" ? "Hauptspur" : "Overdub"}`});
        const playBtn = el("button", {"data-play":`${s.id}|${p.part}|${t}`, onclick: () => togglePlay(s.id, p.part, t)}, "Abspielen");
        canvas.addEventListener("click", ev => togglePlay(s.id, p.part, t, ev.offsetX / canvas.clientWidth));
        body.append(el("div", {class:"track"},
          el("label", {}, t === "main" ? "Hauptspur" : "Overdub", p.current === t ? el("small", {class:"live"}, "spielt") : null), canvas,
          el("span", {class:"acts"}, playBtn,
            el("button", {onclick: run(() => doExport({song:s.id, what:"wav", part:p.part, track:t}))}, "WAV"))));
      }
      if (!any) body.append(el("p", {class:"note"}, "Gelernt, aber ohne Aufnahme."));
    }
    face.append(el("div", {class:"part"}, el("div", {class:"led " + st, "aria-hidden":"true"}, p.part), body));
  }
  m.replaceChildren(head, face, renderBuilder());
  drawWaves();
}

function partOptions() {
  const opts = [];
  for (const s of state.songs) for (const p of s.parts) if (p.trained) {
    const dur = p.tracks ? Math.max(p.tracks.main.seconds, p.tracks.overdub.seconds) : 0;
    opts.push({value:`${s.id}|${p.part}`, label:`${songLabel(s)}${s.number && s.name !== songLabel(s) ? " (" + s.name + ")" : ""}, Part ${p.part}, ${secs(dur)}`});
  }
  return opts;
}
function addToBuilder(song, part) {
  const i = builder.findIndex(x => !x);
  if (i < 0) return status("Alle fünf Parts des neuen Songs sind belegt.", {error:true});
  builder[i] = {song, part};
  render();
  status(`Als Part ${i + 1} in den neuen Song übernommen.`);
}
function renderBuilder() {
  const opts = partOptions();
  const slots = builder.map((b, i) => {
    const sel = el("select", {"aria-label":`Part ${i + 1} des neuen Songs`, onchange: e => {
        builder[i] = e.target.value ? {song:e.target.value.split("|")[0], part:+e.target.value.split("|")[1]} : null; }},
      el("option", {value:""}, "leer"),
      opts.map(o => el("option", {value:o.value, selected: b && o.value === `${b.song}|${b.part}`}, o.label)));
    return el("div", {class:"slot"}, el("span", {}, `Part ${i + 1}`), sel);
  });
  const name = el("input", {type:"text", id:"newName", value:newName, maxlength:"60", "aria-label":"Name des neuen Songs",
    oninput: e => { newName = e.target.value; }});
  return el("section", {class:"builder", "aria-labelledby":"bh"},
    el("h2", {id:"bh"}, "Neuen Song zusammenstellen"),
    el("p", {class:"note"}, "Wähle für jeden Part einen aufgenommenen Part aus einem beliebigen Song. Der neue Song wird als .tlsd gespeichert und lässt sich mit dem TRIO Manager auf die Karte laden."),
    el("div", {class:"slots"}, slots),
    el("div", {class:"row"}, el("div", {style:"flex:1;min-width:12rem"}, name),
      el("button", {onclick: () => { builder.fill(null); render(); }}, "Leeren"),
      el("button", {class:"primary", onclick: run(async () => {
        const n = $("#newName").value.trim();
        if (!/^[ -~]+$/.test(n)) throw new Error("Der Name darf nur einfache Zeichen ohne Umlaute enthalten.");
        const r = await api("/api/build", {name:n, parts:builder});
        state = r.state; builder.fill(null); newName = "Neuer Song"; render();
        status(`Gespeichert: ${r.file}`, {reveal:true}); })}, "Song erstellen")));
}

async function drawWaves() {
  for (const c of document.querySelectorAll("canvas.wave")) {
    const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1;
    c.width = w * dpr; c.height = h * dpr;
    const key = `${c.dataset.song}|${c.dataset.part}|${c.dataset.track}`;
    if (!waveCache[key]) {
      try { waveCache[key] = scaled((await api(`/api/peaks?song=${encodeURIComponent(c.dataset.song)}&part=${c.dataset.part}&track=${c.dataset.track}&n=700`)).peaks); }
      catch (e) { continue; }
    }
    paintWave(c, waveCache[key], key);
  }
}
function scaled(peaks) {
  const top = Math.max(1, ...peaks);
  return top < 1000 ? peaks.map(v => v * 1000 / top) : peaks;
}
const waveCache = {};
function paintWave(c, peaks, key) {
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.clearRect(0,0,W,H);
  const color = c.dataset.track === "main" ? "#2e9e4e" : "#c9433a";
  const n = peaks.length, mid = H / 2;
  const prog = playing && playing.key === key ? playing.progress : -1;
  for (let i = 0; i < n; i++) {
    const x = i / n * W, v = Math.max(1, peaks[i] / 1000 * (H / 2 - 2));
    g.fillStyle = prog >= 0 && i / n <= prog ? "#24282a" : color;
    g.fillRect(x, mid - v, Math.max(1, W / n - .5), v * 2);
  }
}

const player = $("#player");
function togglePlay(song, part, track, at) {
  const key = `${song}|${part}|${track}`;
  if (playing && playing.key === key && at === undefined) { player.pause(); return; }
  playing = {key, progress:0};
  player.src = `/api/wav?song=${encodeURIComponent(song)}&part=${part}&track=${track}&t=${TOKEN}`;
  player.onloadedmetadata = () => { if (at !== undefined) player.currentTime = at * player.duration; };
  player.play().catch(e => status("Wiedergabe nicht möglich: " + e.message, {error:true}));
  updateButtons();
}
player.addEventListener("pause", () => { playing = null; updateButtons(); redraw(); });
player.addEventListener("ended", () => { playing = null; updateButtons(); redraw(); });
player.addEventListener("timeupdate", () => { if (playing && player.duration) { playing.progress = player.currentTime / player.duration; redraw(playing.key); } });
function redraw(only) {
  for (const c of document.querySelectorAll("canvas.wave")) {
    const key = `${c.dataset.song}|${c.dataset.part}|${c.dataset.track}`;
    if ((!only || key === only) && waveCache[key]) paintWave(c, waveCache[key], key);
  }
}
function updateButtons() {
  for (const b of document.querySelectorAll("[data-play]")) b.textContent = playing && playing.key === b.dataset.play ? "Stopp" : "Abspielen";
}

async function importWav(song, part, mode) {
  const r = await api("/api/importwav", {song, part, mode, gain: mode === "mix" ? 0.5 : 1.0, dialog: true});
  if (r.cancelled) return;
  state = r.state;
  const n = state.songs.find(x => r.opened.includes(x.source));
  if (n) current = n.id;
  render();
  let msg = `Gespeichert: ${r.file}`;
  if (r.info.truncated) msg += ` (WAV war länger als der Part und wurde gekürzt)`;
  status(msg, {reveal:true});
}
async function doExport(body) {
  const r = await api("/api/export", body);
  status(r.files.length === 1 ? `Gespeichert: ${r.files[0]}` : `${r.files.length} Dateien gespeichert.`, {reveal:true});
}
async function openPath(body) {
  const r = await api("/api/open", body);
  if (r.cancelled) return;
  state = r.state;
  const first = state.songs.find(s => r.opened.includes(s.source) && s.recorded) || state.songs.find(s => r.opened.includes(s.source));
  if (first) current = first.id;
  render();
}
function render() {
  $("#ver").textContent = state.version ? "Version " + state.version : "";
  const d = state.export_dir || "";
  $("#exportDir").textContent = d.length > 34 ? "…" + d.slice(-33) : d; $("#exportDir").title = d;
  renderSources();
  if (current) renderSong(); else renderEmpty();
}

$("#openCard").onclick = run(() => openPath({dialog:"file"}));
$("#openFolder").onclick = run(() => openPath({dialog:"folder"}));
$("#changeDir").onclick = run(async () => { const r = await api("/api/exportdir", {dialog:true}); state.export_dir = r.export_dir; render(); });
$("#reveal").onclick = $("#statusAction").onclick = run(() => api("/api/reveal", {}));
$("#quit").onclick = run(async () => { await api("/api/quit", {}); document.body.replaceChildren(el("div", {class:"empty-state"},
  el("h1", {}, "TRIO Tool ist beendet"), el("p", {}, "Du kannst dieses Fenster schließen."))); });
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(drawWaves, 150); });
