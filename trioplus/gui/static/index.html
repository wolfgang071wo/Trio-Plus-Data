<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRIO Tool</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500 600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --alu:#d9dcd8; --panel:#eef0ec; --line:#b9bdb8; --graphite:#24282a; --muted:#5d6462;
  --led-green:#2e9e4e; --led-amber:#e09b12; --led-red:#c9433a; --led-off:#a7aca8;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --sans:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--alu);color:var(--graphite);font:16px/1.45 var(--sans);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 3px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:.45rem .8rem}
button:hover{border-color:var(--graphite)}
button.primary{background:var(--graphite);color:var(--panel);border-color:var(--graphite)}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--led-amber);outline-offset:2px}
.shell{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:700 1.6rem/1 var(--cond);letter-spacing:.02em;margin-right:auto;display:flex;align-items:baseline;gap:.6rem}
.brand small{font:500 .95rem var(--cond);color:var(--muted)}
.brand a{color:inherit}
.export{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--muted)}
.export code{font:inherit;color:var(--graphite);white-space:nowrap}
aside{border-right:1px solid var(--line);overflow:auto;padding:1rem .8rem}
main{overflow:auto;padding:1.4rem 1.8rem 3rem}
.src{margin-bottom:1.4rem}
.src h2{font:600 1.05rem var(--cond);margin:0 0 .4rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.src h2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src h2 button{padding:.1rem .45rem;font-size:.8rem}
.src h2 span{flex:1}
.changes{font-size:.85rem;line-height:1.35;margin:.1rem .2rem .6rem;color:var(--muted)}
.changes.warn{color:var(--led-red)}
.song{display:grid;grid-template-columns:2.2rem 1fr auto;align-items:center;gap:.4rem;width:100%;text-align:left;border:1px solid transparent;background:none;padding:.35rem .45rem;border-radius:6px}
.song:hover{border-color:var(--line)}
.song[aria-current="true"]{background:var(--panel);border-color:var(--graphite)}
.song .num{font:600 1.1rem var(--cond);color:var(--muted)}
.song.empty{color:var(--muted)}
.song.empty .num{opacity:.6}
.dots{display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--led-off)}
.dot.g{background:var(--led-green)} .dot.a{background:var(--led-amber)}
.empty-state{max-width:52ch;margin:12vh auto 0}
.empty-state h1{font:700 2.4rem/1.05 var(--cond);margin:0 0 .6rem}
.empty-state p{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.songhead{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;margin-bottom:1.2rem}
.songhead h1{font:700 2.6rem/1 var(--cond);margin:0}
.songhead p{margin:.25rem 0 0;color:var(--muted)}
.face{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.4rem 1rem}
.part{display:grid;grid-template-columns:3.2rem 1fr;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.led{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--led-off);box-shadow:inset 0 2px 3px rgba(0,0,0,.25);display:grid;place-items:center;font:700 1.1rem var(--cond);color:var(--panel)}
.led.g{background:var(--led-green);box-shadow:0 0 12px rgba(46,158,78,.55),inset 0 -2px 3px rgba(0,0,0,.2)}
.led.a{background:var(--led-amber);box-shadow:0 0 10px rgba(224,155,18,.5),inset 0 -2px 3px rgba(0,0,0,.2)}
.parthead{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline;margin-bottom:.4rem}
.parthead strong{font:600 1.2rem var(--cond)}
.parthead span{color:var(--muted);font-size:.9rem}
.track{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.6rem;align-items:center;margin:.25rem 0}
.track label{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;line-height:1.2}
.track label .live{color:var(--led-green);font-weight:600}
.parthead .row button{padding:.3rem .6rem;font-size:.88rem}
.wave{width:100%;height:46px;display:block;background:#e3e6e1;border-radius:4px;cursor:pointer}
.track .acts{display:flex;gap:.35rem}
.track .acts button{padding:.25rem .55rem;font-size:.85rem}
.note{color:var(--muted);font-size:.92rem;margin:.2rem 0}
.chords{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;margin-top:.5rem}
.chords .meta{color:var(--muted);font-size:.9rem}
.chords .seq{font:600 1.15rem var(--cond);letter-spacing:.01em;display:flex;flex-wrap:wrap;gap:.2rem .55rem}
.chords .seq span{border-radius:4px;padding:0 .15rem;transition:background .08s}
.chords .seq span.on{background:var(--led-green);color:var(--panel)}
.chords .seq span{cursor:pointer}
.chords .seq span:hover{outline:1px solid var(--line)}
.chords .seq span.edited{text-decoration:underline;text-decoration-color:var(--led-amber);text-decoration-thickness:3px;text-underline-offset:4px}
.chordedit:empty{display:none}
.chordedit{flex-basis:100%;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
.chordedit select{width:auto}
.chordedit strong{font:600 1.1rem var(--cond)}
.dawrow select{width:auto}
.chords button{padding:.25rem .55rem;font-size:.85rem}
.chords .drumbox{display:flex;align-items:center;gap:.3rem;font-size:.9rem;color:var(--muted);cursor:pointer}
.builder{margin-top:2rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem}
.builder h2{font:700 1.5rem var(--cond);margin:0 0 .2rem}
.slots{display:grid;gap:.45rem;margin:.8rem 0}
.slot{display:grid;grid-template-columns:4.5rem 1fr;gap:.6rem;align-items:center}
.slot span{font:600 1.05rem var(--cond)}
select,input[type=text]{border:1px solid var(--line);background:#fff;border-radius:6px;padding:.4rem .5rem;width:100%}
#status{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--graphite);color:var(--panel);padding:.6rem 1rem;border-radius:8px;max-width:min(90vw,70ch);display:none;gap:.8rem;align-items:center}
#status.show{display:flex}
#status.err{background:var(--led-red)}
#status button{background:transparent;color:inherit;border-color:rgba(255,255,255,.4);padding:.2rem .6rem}
.pathform{display:flex;gap:.5rem;margin-top:1rem}
select.lang{width:auto;padding:.4rem .4rem}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}
  main{padding:1rem}
  .track{grid-template-columns:4.5rem 1fr}
  .track .acts{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">TRIO Tool <small id="ver"></small>
      <small><a id="projLink" href="https://github.com/wolfgang071wo/TrioTool" target="_blank" rel="noopener">Projektseite</a></small></div>
    <button id="openCard">Karte oder Song öffnen…</button>
    <button id="openFolder">Ordner öffnen…</button>
    <div class="export"><span id="saveIn">Speichern in</span> <code id="exportDir" title=""></code>
      <button id="changeDir">Ändern…</button><button id="reveal">Anzeigen</button></div>
    <select id="lang" class="lang" aria-label="Sprache / Language"><option value="de">Deutsch</option><option value="en">English</option></select>
    <button id="quit">Beenden</button>
  </header>
  <aside id="sources" aria-label="Geöffnete Karten und Songs"></aside>
  <main id="main"></main>
</div>
<div id="status" role="status" aria-live="polite"><span id="statusText"></span><button id="statusAction" hidden>Ordner anzeigen</button></div>
<audio id="player" preload="none"></audio>

<script>
const TOKEN = "__TOKEN__";
let LANG = "de";
try { LANG = localStorage.getItem("trioLang") || ((navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en"); } catch (e) {}
if (LANG !== "en") LANG = "de";
const T = (de, en) => LANG === "en" ? en : de;
const GENRES = ["Blues","R&B","Rock","Alt-Rock","Metal","Pop","E-Pop","Hip-Hop","Country","Folk","Latin","Jazz"];
const BASS = () => ({0:T("Bass aktiv","Bass active"),1:T("Bass einfach","Bass simple"),3:T("Bass Riff","Bass riff")});
let state = {sources:[],songs:[]}, current = null, playing = null, cards = [];
const builder = [null,null,null,null,null];
let newName = null;

const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k);
  return e;
};
const api = async (path, body) => {
  const r = await fetch(path + (path.includes("?") ? "&" : "?") + "t=" + TOKEN + "&lang=" + LANG, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN,"X-Lang":LANG}, body:JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || T("Aktion fehlgeschlagen", "Action failed"));
  return j;
};
const secs = s => (LANG === "en" ? s.toFixed(1) : s.toFixed(1).replace(".", ",")) + " s";
let statusTimer;
function status(text, {error=false, reveal=false}={}) {
  $("#statusText").textContent = text;
  $("#status").className = "show" + (error ? " err" : "");
  $("#statusAction").hidden = !reveal;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => $("#status").className = "", error ? 9000 : 6000);
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { status(e.message, {error:true}); } };

function partState(p) {
  if (!p.trained) return "";
  return (p.tracks && (p.tracks.main.has_audio || p.tracks.overdub.has_audio)) ? "g" : "a";
}
function songLabel(s) { return s.number ? `Song ${String(s.number).padStart(2,"0")}` : (s.file || s.name); }

function changesText(c) {
  if (!c) return "";
  if (c.first) return T("Erstes Öffnen dieser Karte. Ab jetzt zeigt die App beim Öffnen, was das Pedal neu gespeichert hat.",
    "First time this card is opened. From now on the app shows what the pedal has saved since.");
  const when = c.since ? new Date(c.since * 1000).toLocaleString(T("de-AT", "en-GB"), {dateStyle:"short", timeStyle:"short"}) : T("dem letzten Öffnen", "it was last opened");
  if (c.nothing) return T(`Seit ${when} hat das Pedal nichts auf diese Karte gespeichert.`, `The pedal has saved nothing to this card since ${when}.`);
  const fmt = list => list.map(x => `Song ${String(x.song).padStart(2,"0")} Part ${x.part}`).join(", ");
  const bits = [];
  if (c.added.length) bits.push(`${T("neu", "new")}: ${fmt(c.added)}`);
  if (c.changed.length) bits.push(`${T("geändert", "changed")}: ${fmt(c.changed)}`);
  if (c.removed.length) bits.push(`${T("gelöscht", "cleared")}: ${fmt(c.removed)}`);
  if (c.selected_before !== c.selected_now && c.selected_now) bits.push(`${T("Song-Auswahl jetzt", "selected song now")} Song ${String(c.selected_now).padStart(2,"0")}`);
  return T(`Seit ${when} ${bits.join("; ")}.`, `Since ${when}: ${bits.join("; ")}.`);
}

function renderSources() {
  const box = $("#sources"); box.replaceChildren();
  if (!state.sources.length) {
    box.append(el("p", {class:"note"}, T("Noch nichts geöffnet.", "Nothing open yet.")));
    return;
  }
  for (const src of state.sources) {
    const songs = state.songs.filter(s => s.source === src.id);
    box.append(el("section", {class:"src"},
      el("h2", {}, el("span", {title:src.path}, src.kind === "card" ? `${T("Karte", "Card")}: ${src.name}` : src.name),
        el("button", {onclick: run(() => openPath({path:src.path})), title:T("Datei neu einlesen, z. B. nachdem das Pedal gespeichert hat", "Read the file again, e.g. after the pedal has saved"),
          "aria-label":T(`${src.name} neu einlesen`, `Reload ${src.name}`)}, T("Neu einlesen", "Reload")),
        el("button", {onclick: run(async () => { const r = await api("/api/close", {source:src.id}); state = r.state;
          if (current && current.startsWith(src.id + ":")) current = null; render(); }), "aria-label":T(`${src.name} schließen`, `Close ${src.name}`)}, T("Schließen", "Close"))),
      src.changes ? el("p", {class:"changes" + (src.changes.nothing ? " warn" : "")}, changesText(src.changes)) : null,
      songs.map(s => el("button", {class:"song" + (s.recorded ? "" : " empty"), "aria-current": s.id === current ? "true" : "false",
          onclick: () => { current = s.id; render(); }},
        el("span", {class:"num"}, s.number ? String(s.number).padStart(2,"0") : "·"),
        el("span", {}, s.name),
        el("span", {class:"dots", "aria-hidden":"true"}, s.parts.map(p => el("span", {class:"dot " + partState(p)})))))
    ));
  }
}

function renderEmpty() {
  const m = $("#main");
  const form = el("form", {class:"pathform", onsubmit: run(async e => { e.preventDefault();
      const p = $("#pathInput").value.trim(); if (p) await openPath({path:p}); })},
    el("input", {type:"text", id:"pathInput", placeholder:T("Pfad, z. B. E:\\TRIOPLUS.DAT", "Path, e.g. E:\\TRIOPLUS.DAT"), "aria-label":T("Pfad zur Karte, zu einem Song oder Ordner", "Path to a card, song or folder")}),
    el("button", {type:"submit"}, T("Öffnen", "Open")));
  m.replaceChildren(el("div", {class:"empty-state"},
    el("h1", {}, T("Songs vom TRIO+ holen", "Get your songs off the TRIO+")),
    el("p", {}, T("Öffne die TRIOPLUS.DAT von der SD-Karte, einen exportierten Song (.tlsd) oder einen Ordner mit Songs. Die Dateien werden nur gelesen.",
      "Open TRIOPLUS.DAT from the SD card, an exported song (.tlsd) or a folder of songs. The files are only read, never changed.")),
    cards.length ? el("div", {class:"row"}, cards.map(c => el("button", {class:"primary", onclick: run(() => openPath({path:c}))}, `${T("SD-Karte öffnen", "Open SD card")}: ${c}`))) : null,
    form));
}

function bandText(p) {
  if (!p.band) return "";
  const b = p.band, bits = [];
  bits.push(GENRES[b.genre] || `Genre ${b.genre + 1}`);
  bits.push(`Style ${b.style + 1}`);
  bits.push(BASS()[b.bass_mode] || `${T("Bassmodus", "Bass mode")} ${b.bass_mode}`);
  if (b.alt_time) bits.push("Alt Time");
  return bits.join(", ");
}

function renderSong() {
  synthStop();
  const s = state.songs.find(x => x.id === current);
  if (!s) { current = null; return renderEmpty(); }
  const src = state.sources.find(x => x.id === s.source);
  const m = $("#main");
  const head = el("div", {class:"songhead"},
    el("div", {}, el("h1", {}, s.name), el("p", {}, `${songLabel(s)} ${T("auf", "on")} ${src ? src.name : ""}`)),
    s.recorded ? el("div", {class:"row"},
      el("button", {onclick: run(() => doExport({song:s.id, what:"wav"}))}, T("Alle Spuren als WAV speichern", "Save all tracks as WAV")),
      el("button", {onclick: run(() => doExport({song:s.id, what:"midi", edits: editsFor(s)})),
        title:T("Akkorde, Bass und Drums aller Parts als MIDI-Dateien", "Chords, bass and drums of all parts as MIDI files")}, T("Akkorde als MIDI", "Chords as MIDI")),
      el("span", {class:"row dawrow"},
        el("select", {id:"dawRepeats", "aria-label":T("Wie oft jeder Part im DAW-Paket gespielt wird", "How often each part plays in the DAW package")},
          [1, 2, 4].map(n => el("option", {value:n}, `Parts ${n}×`))),
        el("button", {onclick: run(async () => { const r = await api("/api/export", {song:s.id, what:"daw",
            edits: editsFor(s), repeats: +$("#dawRepeats").value});
            status(`${T("Song-Paket gespeichert", "Song package saved")}: ${r.files[0]}`, {reveal:true}); }),
          title:T("Ordner mit Gitarre.wav und Song.mid (Akkorde, Bass, Drums), synchron, für Ardour, Reaper und andere DAWs",
            "Folder with Guitar.wav and Song.mid (chords, bass, drums), in sync, for Ardour, Reaper and other DAWs")},
          T("Für DAW exportieren", "Export for DAW"))),
      el("button", {class:"primary", onclick: run(() => doExport({song:s.id, what:"tlsd"}))}, T("Als .tlsd speichern", "Save as .tlsd"))) : null);
  const face = el("div", {class:"face"});
  if (!s.parts.some(p => p.trained)) face.append(el("p", {class:"note"}, T("In diesem Song ist nichts aufgenommen.", "Nothing is recorded in this song.")));
  for (const p of s.parts) {
    const st = partState(p);
    const body = el("div", {});
    if (!p.trained) {
      body.append(el("div", {class:"parthead"}, el("strong", {}, `Part ${p.part}`), el("span", {}, T("leer", "empty"))));
    } else {
      const dur = Math.max(p.tracks.main.seconds, p.tracks.overdub.seconds);
      body.append(el("div", {class:"parthead"}, el("strong", {}, `Part ${p.part}`), el("span", {}, secs(dur)), el("span", {}, bandText(p)),
        el("span", {class:"row"},
          el("button", {onclick: () => addToBuilder(s.id, p.part)}, T("In neuen Song übernehmen", "Add to new song")),
          el("button", {onclick: run(() => importWav(s.id, p.part, "replace")),
            title:T("Eine WAV-Datei wird zur Aufnahme dieses Parts. Länge und gelernte Begleitung bleiben.",
              "A WAV file becomes this part's recording. Length and learned accompaniment stay.")}, T("WAV als Aufnahme…", "WAV as recording…")),
          p.current ? el("button", {onclick: run(() => importWav(s.id, p.part, "mix")),
            title:T("Eine WAV-Datei wird leiser zur gespielten Spur dazugemischt.", "A WAV file is mixed in, quieter, with the playing track.")},
            T("WAV dazumischen…", "Mix in WAV…")) : null)));
      let any = false;
      for (const t of ["main","overdub"]) {
        if (!p.tracks[t].has_audio) continue;
        any = true;
        const canvas = el("canvas", {class:"wave", "data-song":s.id, "data-part":p.part, "data-track":t,
          role:"img", "aria-label":`${T("Wellenform", "Waveform")} Part ${p.part} ${t === "main" ? T("Hauptspur", "Main track") : "Overdub"}`});
        const playBtn = el("button", {"data-play":`${s.id}|${p.part}|${t}`, onclick: () => togglePlay(s.id, p.part, t)}, T("Abspielen", "Play"));
        canvas.addEventListener("click", ev => togglePlay(s.id, p.part, t, ev.offsetX / canvas.clientWidth));
        body.append(el("div", {class:"track"},
          el("label", {}, t === "main" ? T("Hauptspur", "Main track") : "Overdub", p.current === t ? el("small", {class:"live"}, T("spielt", "playing")) : null), canvas,
          el("span", {class:"acts"}, playBtn,
            el("button", {onclick: run(() => doExport({song:s.id, what:"wav", part:p.part, track:t}))}, "WAV"))));
      }
      if (p.has_layer) {
        const t = "layer";
        const canvas = el("canvas", {class:"wave", "data-song":s.id, "data-part":p.part, "data-track":t,
          role:"img", "aria-label":`${T("Wellenform", "Waveform")} Part ${p.part} ${T("letzte Ebene", "last layer")}`});
        canvas.addEventListener("click", ev => togglePlay(s.id, p.part, t, ev.offsetX / canvas.clientWidth));
        body.append(el("div", {class:"track"},
          el("label", {title: p.undone ? T("Ein Overdub, der am Pedal rückgängig gemacht wurde", "An overdub that was undone on the pedal") :
              T("Nur das zuletzt Eingespielte, herausgerechnet aus beiden Spuren", "Only what was played last, separated from both tracks")},
            T("Letzte Ebene", "Last layer"), el("small", {}, p.undone ? T("rückgängig", "undone") : T("einzeln", "isolated"))), canvas,
          el("span", {class:"acts"},
            el("button", {"data-play":`${s.id}|${p.part}|${t}`, onclick: () => togglePlay(s.id, p.part, t)}, T("Abspielen", "Play")),
            el("button", {onclick: run(() => doExport({song:s.id, what:"wav", part:p.part, track:t}))}, "WAV"))));
      }
      if (!any) body.append(el("p", {class:"note"}, T("Gelernt, aber ohne Aufnahme.", "Learned, but no recording.")));
      if (p.harmony) {
        const hasAudio = p.tracks && (p.tracks.main.has_audio || p.tracks.overdub.has_audio);
        const pid = `${s.id}|${p.part}`;
        body.append(el("div", {class:"chords"},

async function drawWaves() {

    if (!waveCache[key]) {
      try { waveCache[key] = scaled((await api(`/api/peaks?song=${encodeURIComponent(c.dataset.song)}&part=${c.dataset.part}&track=${c.dataset.track}&n=700`)).peaks); }
      catch (e) { continue; }

  const n = peaks.length, mid = H / 2;

}

// Bass: a plucked string in the manner of a fingerstyle Jazz Bass. Karplus-Strong
// string (smoothed noise as the finger, comb for pluck/pickup position) plus a
// little fundamental for body, rendered once per note; played through a gentle
// low-pass like a slightly rolled-back tone knob. No distortion.
const bassCache = {};
function bassBuffer(ctx, note) {
  const sr = ctx.sampleRate, key = sr + ":" + note;
  if (bassCache[key]) return bassCache[key];
  const f = mtof(note), len = Math.floor(sr * 3);
  const N = Math.max(2, Math.round(sr / f - 0.5));          // loop delay incl. the averaging half sample
  const rho = Math.pow(0.001, 1 / (3.2 * f));               // about -60 dB after 3.2 s
  const ex = new Float32Array(N); let lp = 0;
  for (let i = 0; i < N; i++) { lp = lp * 0.55 + (Math.random() * 2 - 1) * 0.45; ex[i] = lp; }  // soft finger
  const pos = Math.max(1, Math.round(N * 0.18));            // pluck near the bridge pickup

    const a = i >= N ? y[i - N] : 0, b2 = i > N ? y[i - N - 1] : 0;
    y[i] = x + rho * 0.5 * (a + b2);

  let peak = 1e-6;
  for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(y[i]));
  for (let i = 0; i < len; i++) {                           // normalise, add the round fundamental
    const t = i / sr;
    y[i] = 0.75 * y[i] / peak + 0.4 * Math.sin(2 * Math.PI * f * t) * Math.exp(-t / 1.1) * Math.min(1, t * 400);

}

    case 44: metal(1, 9000, 6500, 1.4, 0.045); break;          // pedal hat
    case 46: metal(1, 10000, 6500, 1.7, 0.38);                // open hat

    case 51: metal(1.17, 7500, 4000, 0.55, 1.0);               // ride

    case 49: metal(1.08, 8000, 3500, 0.75, 1.7);               // crash

    case 50: osc("sine", 230, 160, 0.12, 0.85, 0.32); noiseSrc("lowpass", 1800, 0.7, 0.12, 0.05); break; // high tom
    case 47: osc("sine", 175, 120, 0.14, 0.85, 0.36); noiseSrc("lowpass", 1500, 0.7, 0.12, 0.05); break; // mid tom

  if (playing) player.pause();
  if (wasMine) return;
  const h = half && p.harmony.half ? p.harmony.half : p.harmony;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  synth = {ctx, key, raf: 0};
  updateSynthButtons();
  let buffer = null;
  if (withAudio) {
    const track = p.current || (p.tracks.main.has_audio ? "main" : "overdub");
    const bk = `${songId}|${p.part}|${track}`;
    if (!audioBuffers[bk]) {
      const r = await fetch(`/api/wav?song=${encodeURIComponent(songId)}&part=${p.part}&track=${track}&t=${TOKEN}`);
      audioBuffers[bk] = await r.arrayBuffer();
    }
    if (!synth || synth.ctx !== ctx) return;
    buffer = await ctx.decodeAudioData(audioBuffers[bk].slice(0));
  }
  const spb = 60 / h.tempo, t0 = ctx.currentTime + 0.15;
  const master = ctx.createGain(); master.gain.value = withAudio ? 0.55 : 0.8; master.connect(ctx.destination);
  const chordBus = ctx.createBiquadFilter(); chordBus.type = "lowpass"; chordBus.frequency.value = 2200; chordBus.connect(master);
  const bassBus = ctx.createGain(); bassBus.gain.value = 1.0; bassBus.connect(master);
  const voice = (freq, start, dur, type, bus, level, decay) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(level, start + 0.012);
    g.gain.setTargetAtTime(level * decay, start + 0.03, 0.25);
    g.gain.setTargetAtTime(0, start + Math.max(0.05, dur - 0.04), 0.03);
    o.connect(g); g.connect(bus); o.start(start); o.stop(start + dur + 0.25);
  };
  const drumBox = document.querySelector(`[data-drums="${songId}|${p.part}"]`);
  if (!drumBox || drumBox.checked) {
    const drumBus = ctx.createGain(); drumBus.gain.value = withAudio ? 0.6 : 0.85; drumBus.connect(master);
    const kit = drumKit(ctx, drumBus);
    for (const [beat, note, vel] of h.drums) drum(ctx, kit, note, t0 + beat * spb, vel / 127);
  }
  const song = state.songs.find(x => x.id === songId);
  for (const g of effSegments(song, p, h)) {
    const s0 = t0 + g.beat * spb, s1 = t0 + g.end * spb;
    for (const k of g.keys) voice(mtof(k), s0, s1 - s0, "triangle", chordBus, 0.09, 0.55);
    for (let b = g.beat; b < g.end; b++) bassNote(ctx, bassBus, mtof(g.bass), t0 + b * spb, spb * 0.9, b === g.beat ? 1 : 0.82);
  }
  if (buffer) {
    const src = ctx.createBufferSource(), gain = ctx.createGain();
    gain.gain.value = 0.9; src.buffer = buffer; src.connect(gain); gain.connect(ctx.destination); src.start(t0);
  }
  const total = h.beats * spb;
  const spans = document.querySelectorAll(`[data-seq="${songId}|${p.part}"] span`);
  const tick = () => {
    if (!synth || synth.ctx !== ctx) return;
    const beat = (ctx.currentTime - t0) / spb;
    if (ctx.currentTime - t0 > total + 0.3) { synthStop(); return; }
    let idx = -1;
    h.segments.forEach((g, i) => { if (beat >= g.beat && beat < g.end) idx = i; });
    spans.forEach((sp, i) => sp.classList.toggle("on", i === idx && h === p.harmony));
    synth.raf = requestAnimationFrame(tick);
  };
  synth.raf = requestAnimationFrame(tick);
}

async function doExport(body) {
  const r = await api("/api/export", body);
  status(r.files.length === 1 ? `${T("Gespeichert", "Saved")}: ${r.files[0]}` : T(`${r.files.length} Dateien gespeichert.`, `${r.files.length} files saved.`), {reveal:true});
}
async function openPath(body) {
  const r = await api("/api/open", body);
  if (r.cancelled) return;
  state = r.state;
  const first = state.songs.find(s => r.opened.includes(s.source) && s.recorded) || state.songs.find(s => r.opened.includes(s.source));
  if (first) current = first.id;
  render();
  const card = state.sources.find(x => r.opened.includes(x.id) && x.changes);
  if (card) status(changesText(card.changes), {error: !!card.changes.nothing});
}
function renderChrome() {
  document.documentElement.lang = LANG;
  $("#lang").value = LANG;
  const texts = {"#projLink":["Projektseite","Project page"], "#openCard":["Karte oder Song öffnen…","Open card or song…"],
    "#openFolder":["Ordner öffnen…","Open folder…"], "#saveIn":["Speichern in","Save to"], "#changeDir":["Ändern…","Change…"],
    "#reveal":["Anzeigen","Show"], "#quit":["Beenden","Quit"], "#statusAction":["Ordner anzeigen","Show folder"]};
  for (const [sel, [de, en]] of Object.entries(texts)) $(sel).textContent = T(de, en);
  $("#sources").setAttribute("aria-label", T("Geöffnete Karten und Songs", "Open cards and songs"));
}
function render() {
  renderChrome();
  $("#ver").textContent = state.version ? "Version " + state.version : "";
  const d = state.export_dir || "";
  $("#exportDir").textContent = d.length > 34 ? "…" + d.slice(-33) : d; $("#exportDir").title = d;
  renderSources();
  if (current) renderSong(); else renderEmpty();
}

$("#openCard").onclick = run(() => openPath({dialog:"file"}));
$("#openFolder").onclick = run(() => openPath({dialog:"folder"}));
$("#changeDir").onclick = run(async () => { const r = await api("/api/exportdir", {dialog:true}); state.export_dir = r.export_dir; render(); });
$("#reveal").onclick = $("#statusAction").onclick = run(() => api("/api/reveal", {}));
$("#quit").onclick = run(async () => { await api("/api/quit", {}); document.body.replaceChildren(el("div", {class:"empty-state"},
  el("h1", {}, T("TRIO Tool ist beendet", "TRIO Tool has stopped")), el("p", {}, T("Du kannst dieses Fenster schließen.", "You can close this window.")))); });
$("#lang").onchange = e => { LANG = e.target.value === "en" ? "en" : "de"; try { localStorage.setItem("trioLang", LANG); } catch (err) {}
  if (newName === "Neuer Song" || newName === "New song") newName = null; render(); };
window.addEventListener("resize", () => { clearTimeout(window._rz); window._rz = setTimeout(drawWaves, 150); });

(async () => {
  try {
    state = await api("/api/state");
    cards = (await api("/api/cards")).cards;
    const first = state.songs.find(s => s.recorded) || state.songs[0];
    if (first) current = first.id;
  } catch (e) { status(e.message, {error:true}); }
  render();
