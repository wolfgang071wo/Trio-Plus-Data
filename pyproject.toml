[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trioplus"
dynamic = ["version"]
description = "Read, extract and rebuild DigiTech TRIO+ song files (.tlsd)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
trio = "trioplus.cli:main"
trio-gui = "trioplus.gui.server:main"

[tool.setuptools]
packages = ["trioplus", "trioplus.gui"]

[tool.setuptools.dynamic]
version = { attr = "trioplus.__version__" }

[tool.setuptools.package-data]
trioplus = ["data/*.tlsd"]
"trioplus.gui" = ["static/*.html", "static/fonts/*"]
